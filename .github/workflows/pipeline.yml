# NYC TLC — ML Pipeline CI/CD
# ==============================
#
# This workflow automates the NYC TLC ML pipeline. It runs the entire training
# and drift detection pipeline, and conditionally triggers alert jobs.
#
# Triggers
# --------
#   workflow_dispatch - manually run via GitHub UI with configurable inputs:
#                       * wandb_project: Target Weights & Biases project
#                       * sample_size: Data subsampling limit (e.g. 5000) for smoke tests
#                       * tuning_sample_size: Subsampling limit for sweeps
#                       * act: Run a specific Act (1-6) or leave empty for all
#   push to main      - (commented out) triggers execution on any code/data change
#   schedule          - (commented out) triggers weekly check every Monday at 07:00 UTC
#
# Jobs
# ----
#   validate         → (commented out) data validation job
#   train-and-detect → runs pipeline.py orchestration, logs to W&B, and checks for drift
#   notify-on-drift  → (commented out) triggers terminal notification if drift was detected
#
# Setup required
# --------------
#   1. Add WANDB_API_KEY to your repository Secrets
#   2. Add GEMINI_API_KEY to your repository Secrets (for Google AI integrations)

name: NYC TLC ML Pipeline — Drift Monitoring

on:
  workflow_dispatch:
    inputs:
      wandb_project:
        description: 'Weights & Biases project name to log metrics'
        required: false
        default: 'dsma-nyc-tlc-taxi-test2'
      sample_size:
        description: 'Row count for training/testing raw data (Smoke Test). Set empty for full run.'
        required: false
        default: '5000'
      tuning_sample_size:
        description: 'Subsample size for hyperparameter tuning sweeps'
        required: false
        default: '1000'
      act:
        description: 'Specify Act (1-6) to run only a single phase. Leave empty to run full pipeline.'
        required: false
        default: ''

  # push:
  #   branches: [main]
  #   paths:
  #     - "data/raw/**.parquet"
  #     - "src/**.py"
  #     - "pipeline.py"
  #     - "requirements.txt"

  # schedule:
  #   - cron: "0 7 * * 1"

jobs:

  # ── Job 1: Data validation (Optional/Commented out) ─────────────────────────
  # This job is commented out because validation is integrated into Act 1 of pipeline.py.
  # validate:
  #   name: Validate raw data quality
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.11"
  #         cache: "pip"
  #     - name: Install dependencies
  #       run: pip install -r requirements.txt

  # ── Job 2: Run pipeline and detect drift ────────────────────────────────────
  train-and-detect:
    name: Run ML Pipeline
    runs-on: ubuntu-latest

    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline script
        run: |
          python pipeline.py \
            --wandb-project "${{ inputs.wandb_project }}" \
            ${{ inputs.sample_size != '' && format('--sample-size {0}', inputs.sample_size) || '' }} \
            ${{ inputs.tuning_sample_size != '' && format('--tuning-sample-size {0}', inputs.tuning_sample_size) || '' }} \
            ${{ inputs.act != '' && format('--act {0}', inputs.act) || '' }}

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-outputs-${{ github.run_id }}
          path: |
            outputs/
            data/processed/drift_eval.parquet

      - name: Check if drift report was produced
        id: drift-check
        run: |
          if [ -f "outputs/evidently_drift_report.html" ]; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
          fi

    outputs:
      drift_detected: ${{ steps.drift-check.outputs.drift_detected }}

  # ── Job 3: Notify on significant drift ──────────────────────────────────────
  notify-on-drift:
    name: Notify on drift detected
    needs: train-and-detect
    runs-on: ubuntu-latest
    if: needs.train-and-detect.outputs.drift_detected == 'true'

    steps:
      - name: Download pipeline outputs
        uses: actions/download-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_id }}

      - name: Send drift alert
        run: |
          echo "========================================"
          echo "  DRIFT DETECTED — mitigation was run"
          echo "  Check the W&B project for full metrics"
          echo "  Evidently report is in the artifacts"
          echo "========================================"
